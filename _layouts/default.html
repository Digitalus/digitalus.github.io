<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
        })();
    </script>
    <link rel="stylesheet" href="{{ '/css/tailwind.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>
<body id="top" class="flex min-h-screen flex-col bg-canvas font-sans text-ink antialiased">
    <div class="lines">
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
</div>
    {% include header.html %}
    <main class="flex-1">
        {{ content }}
    </main>
    {% include footer.html %}
    <a href="#top" class="fixed right-0 top-1/2 z-40 -translate-y-1/2 rounded-l-lg bg-accent px-2.5 py-4 text-sm font-semibold text-navy shadow-lg transition hover:pr-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-navy" aria-label="Back to top">
        <span class="flex flex-col items-center gap-2">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-6 6m6-6l6 6"/>
            </svg>
            <span class="[writing-mode:vertical-rl]">Top</span>
        </span>
    </a>
    <script src="{{ '/js/scripts.js' | relative_url }}"></script>
</body>
</html>
