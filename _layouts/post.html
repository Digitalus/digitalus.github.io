---
layout: default
---
<article class="mx-auto max-w-3xl px-4 py-12 sm:px-6 sm:py-16">
    <a href="{{ '/blog/' | relative_url }}" class="text-sm font-medium text-brand hover:underline">&larr; All posts</a>
    <header class="mt-6 border-b border-line pb-8">
        <time datetime="{{ page.date | date_to_xmlschema }}" class="text-sm text-muted">{{ page.date | date: "%B %-d, %Y" }}</time>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-ink sm:text-4xl">{{ page.title }}</h1>
        {% if page.tags %}
        <ul class="mt-4 flex flex-wrap gap-2">
            {% for tag in page.tags %}
            <li class="rounded-full bg-line px-2.5 py-1 text-xs font-medium text-muted">{{ tag }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </header>
    <div class="prose post-content mt-8 max-w-none">
        {{ content }}
    </div>
</article>
