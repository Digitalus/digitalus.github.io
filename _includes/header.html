<header class="sticky top-0 z-50 border-b border-line bg-surface/90 backdrop-blur">
    <nav class="relative mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
        <a href="{{ '/' | relative_url }}" class="bg-gradient-to-r from-sky to-title-end bg-clip-text text-xl font-extrabold tracking-tight text-transparent">{{ site.title }}</a>

        <button id="menu-toggle" type="button" class="rounded-md p-2 text-muted hover:text-ink md:hidden" aria-label="Toggle menu" aria-controls="site-menu" aria-expanded="false">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <ul id="site-menu" class="absolute left-0 right-0 top-full hidden flex-col gap-1 border-b border-line bg-surface p-4 text-sm font-medium md:static md:flex md:flex-row md:items-center md:gap-6 md:border-0 md:bg-transparent md:p-0">
            <li><a href="{{ '/' | relative_url }}" class="block rounded-md px-2 py-1.5 text-muted hover:text-accent">Home</a></li>
            <li><a href="{{ '/#projects' | relative_url }}" class="block rounded-md px-2 py-1.5 text-muted hover:text-accent">Projects</a></li>
            <li><a href="{{ '/blog/' | relative_url }}" class="block rounded-md px-2 py-1.5 text-muted hover:text-accent">Blog</a></li>
            <li><a href="{{ '/#about' | relative_url }}" class="block rounded-md px-2 py-1.5 text-muted hover:text-accent">About</a></li>
            <li><a href="{{ '/#contact' | relative_url }}" class="block rounded-md px-2 py-1.5 text-muted hover:text-accent">Contact</a></li>
            <li>
                <button id="theme-toggle" type="button" class="rounded-md border border-line p-2 text-muted hover:text-ink" aria-label="Toggle dark mode">
                    <svg class="icon-moon h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                    <svg class="icon-sun h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" stroke-width="2"/>
                        <path stroke-linecap="round" stroke-width="2" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
                    </svg>
                </button>
            </li>
        </ul>
    </nav>
</header>
