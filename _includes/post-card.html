<article class="flex flex-col rounded-xl border border-line bg-surface p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-accent hover:shadow-md">
    <time datetime="{{ include.post.date | date_to_xmlschema }}" class="text-sm text-muted">{{ include.post.date | date: "%B %-d, %Y" }}</time>
    <h3 class="mt-2 text-xl font-semibold text-ink">
        <a href="{{ include.post.url | relative_url }}" class="hover:text-brand">{{ include.post.title }}</a>
    </h3>
    <p class="mt-3 flex-1 text-muted">{{ include.post.description }}</p>
    <a href="{{ include.post.url | relative_url }}" class="mt-5 text-sm font-medium text-accent hover:underline">Read more &rarr;</a>
</article>
